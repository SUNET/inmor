name: Lint

permissions: {}
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # pnpm comes from corepack (bundled with the runner's Node.js), pinned
      # to the version that wrote admin/frontend/pnpm-lock.yaml. The frozen
      # lockfile install is needed by the lint-frontend type check.
      - name: Install frontend dependencies
        working-directory: admin/frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate
          pnpm install --frozen-lockfile

      - name: lint
        run: uvx --from=rust-just just lint
