name: Lint

permissions: {}
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # pnpm comes from corepack (bundled with the runner's Node.js), pinned
      # to the version that wrote admin/frontend/pnpm-lock.yaml. The frozen
      # lockfile install is needed by the lint-frontend type check.
      - name: Install frontend dependencies
        working-directory: admin/frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate
          pnpm install --frozen-lockfile

      - name: lint
        run: uvx --from=rust-just just lint
