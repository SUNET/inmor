name: Build and run tests

permissions: {}
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
        # will assign a random free host port
        - 5432/tcp
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"

      # pytest-redis starts its own redis-server, so only the binary is needed.
      # The Ubuntu package comes from the runner's apt mirror instead of a
      # GitHub release download, which failed with HTTP 504s.
      - name: Install redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl stop redis-server || true
          redis-server --version

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build TA application
        run: cargo build

      - name: Add our CA public certificate to the system trust store
        run: |
          sudo cp dev/rootCA.pem /usr/local/share/ca-certificates/rootCA.crt
          sudo update-ca-certificates

      - name: Run tests for inmor TA
        run: just test-ta

      - name: Run tests for inmor Admin API
        run: just test-admin
        env:
          # use localhost for the host here because we are running the job on the VM.
          # If we were running the job in a container this would be postgres.
          DB_HOST: localhost
          # Use the randomly assigned host port published by the PostgreSQL service.
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_LOCATION: "redis://localhost:6088/0"
