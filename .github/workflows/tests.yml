name: Build and run tests

permissions: {}
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
        # will assign a random free host port
        - 5432/tcp
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: actions-setup-redis
        uses: shogo82148/actions-setup-redis@v1.51.0
        with:
          auto-start: false
          distribution: "valkey"
          redis-version: "7.2"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build TA appliation
        run: cargo build

      - name: Add our CA public certificate to the system trust store
        run: |
          sudo cp dev/rootCA.pem /usr/local/share/ca-certificates/rootCA.crt
          sudo update-ca-certificates

      - name: Run tests for inmor TA
        run: just test-ta

      - name: Run tests for inmor Admin API
        run: just test-admin
        env:
          # use localhost for the host here because we are running the job on the VM.
          # If we were running the job on in a container this would be postgres
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }} # get randomly assigned published port
          REDIS_LOCATION: "redis://localhost:6088/0"
