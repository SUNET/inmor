[project]
name = "pyinmor"
authors = [{name = "Kushal Das", email = "kushal@sunet.se"}]
version = "0.5.0"
description = "Inmor Trust Anchor"
license = { file="LICENSE" }
requires-python = '>=3.13'

dependencies = [
	"jwcrypto",
	"httpx",
	"redis",
	"port-for",
	"pytest-redis",
	"pytest",
	"python-dotenv",
	"pytest-dotenv",
	"ruff",
	"scriv",
]

[project.urls]
Home = "https://github.com/SUNET/inmor"

[tool.uv]
# Supply-chain cooling window: never resolve distributions published after
# this date. A fixed UTC timestamp (not a rolling span, and not a bare
# date which uv resolves against the local timezone) keeps `uv sync
# --locked` builds reproducible across hosts and the UTC build container.
# Bump deliberately when updating dependencies.
exclude-newer = "2026-10-19T00:00:00Z"
# Security exception to the cooling window: certifi 2026.10.19 is the
# corrected root CA incident release. It drops "emSign ECC Root CA - G3",
# matching Debian's ca-certificates 20250419+deb13u1 (2026.10.18 had also
# dropped three emSign roots that were later restored).
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.pyright]
stubPath = "typings"
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnannotatedClassAttribute = false
reportExplicitAny = false
reportImplicitOverride = false
reportUninitializedInstanceVariable = false

[tool.ruff]
line-length = 100
exclude = [
    "db",
    "redis",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "django_redis",
]

[tool.ruff.lint]
# Keep Ruff's historical default rule set stable across tool upgrades, as
# admin/pyproject.toml does.
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
exclude = [
    "db",
]

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = ["."]

[tool.scriv]
version = "literal: pyproject.toml: project.version"
format = "md"
