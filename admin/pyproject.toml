[project]
name = "inmoradmin"
authors = [{name = "Kushal Das", email = "kushal@sunet.se"}]
version = "0.4.1"
description = "Inmor Trust Anchor Admin portal"
license = { file="LICENSE" }
requires-python = '>=3.13'

dependencies = [
	"jwcrypto",
	"oidfpolicy",
	"httpx",
	"redis",
	"django>=6,<7",
	"django-types",
	"black",
	"ruff",
	"django-extensions",
	"django-debug-toolbar",
	"django-ninja",
	"pytz",
	"psycopg2-binary",
	# PySAML2 7.5.1+ caps pyOpenSSL below 24.3, which is incompatible
	# with current Cryptography releases. Remove once upstream relaxes it.
	"pysaml2==7.5.0",
	"djangosaml2",
	"django-redis",
	"types-jwcrypto",
	"django-click",
	"pydantic",
	"ty",
	"port-for",
	"pytest-redis",
	"pytest",
	"pytest-django",
	"humanreadable",
	"python-dotenv",
	"pytest-dotenv",
	"django-allauth",
	"django-cors-headers",
	"fido2",
	"whitenoise",
	"qrcode",
	"cryptography",
	"granian",
]

[project.urls]
Home = "https://github.com/SUNET/inmor"

[tool.uv]
# Supply-chain cooling window: never resolve distributions published after
# this date. A fixed UTC timestamp (not a rolling span, and not a bare
# date which uv resolves against the local timezone) keeps `uv sync
# --locked` builds reproducible across hosts and the UTC build container.
# Bump deliberately when updating dependencies.
exclude-newer = "2026-08-24T00:00:00Z"

[tool.pyright]
stubPath = "typings"
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnannotatedClassAttribute = false
reportExplicitAny = false
reportImplicitOverride = false
reportUninitializedInstanceVariable = false

[tool.ruff]
line-length = 100
exclude = [
    "db",
    "redis",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "*.md",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "django_redis",
]

[tool.ruff.lint]
# Keep Ruff's historical default rule set stable across tool upgrades.
select = ["E4", "E7", "E9", "F"]

[tool.ty.src]
exclude = [
    "db",
]

[tool.ty.rules]
# ty is pre-1.0 and its newer releases report substantially more diagnostics.
# Keep them visible without turning this dependency update into a typing rewrite.
unresolved-attribute = "warn"
invalid-argument-type = "warn"
invalid-method-override = "warn"
unused-type-ignore-comment = "warn"

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "inmoradmin.settings"
env_files = [".env"]
filterwarnings = ["ignore::DeprecationWarning"]
