[package]
name = "inmor"
version = "0.5.0"
edition = "2024"

[[bin]]
name = "inmor"
path = "src/bin/inmor/main.rs"

[[bin]]
name = "inmor-collection"
path = "src/bin/inmor-collection/main.rs"

[[bin]]
name = "inmor-keygeneration"
path = "src/bin/inmor-keygeneration/main.rs"

[dependencies]
# All default features except `http2`: actix-http 3.x implements HTTP/2 with
# h2 0.3, which has no fix for RUSTSEC-2026-0258 (unbounded empty DATA
# frames). The TA serves HTTP/1.1; reverse proxies may still offer HTTP/2 to
# clients.
actix-web = { version = "4.17.0", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
    "rustls-0_23",
] }
josekit = "0.10.3"
redis = { version = "1.7.1",  features = ["tokio-comp", "connection-manager"] }
serde = "1.0.219"
serde_json = "1.0.140"
config = "0.15.11"
lazy_static = "1.5.0"
# reqwest 0.13 defaults to rustls; keep native-tls (OpenSSL) so outbound
# federation requests keep trusting the system CA store (Debian
# ca-certificates), as with 0.12. `form` is needed for RequestBuilder::form.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "form"] }
actix-web-lab = "0.29.5"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11.8"
log = "0.4.27"
base64 = "0.23"
oidfed_metadata_policy = "0.8.0"
anyhow = "1.0.98"
toml = "1.1"
clap = { version = "4.5.41", features = ["derive"] }
sha2 = "0.11.1"
rustls = "0.23"
rustls-pemfile = "2.2"
tera = { version = "2.4", features = ["glob_fs"] }
url = "2"
